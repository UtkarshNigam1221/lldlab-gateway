server:
  port: 1221
  host: "0.0.0.0"
  read_timeout: 30s
  write_timeout: 30s
  idle_timeout: 120s

cors:
  allowed_origins:
    - "https://lldlab-frontend.vercel.app"
    - "http://localhost:3000"
  allowed_methods:
    - "GET"
    - "POST"
    - "PUT"
    - "DELETE"
    - "PATCH"
    - "OPTIONS"
  allowed_headers:
    - "Content-Type"
    - "Authorization"
    - "X-Requested-With"
  expose_headers:
    - "Content-Length"
  allow_credentials: true
  max_age: 7200

routes:
  - path: "/api/auth"
    prefix: true
    target: "https://lldlab-bff.onrender.com"
    methods: ["GET", "POST", "OPTIONS"]

  - path: "/api/users"
    prefix: true
    target: "http://user-service:8082"
    methods: ["GET", "POST", "PUT", "DELETE"]
    
  - path: "/api/products"
    prefix: true
    target: "http://product-service:8083"
    methods: ["GET", "POST", "PUT", "DELETE"]
    
  - path: "/api/orders"
    prefix: true
    target: "http://order-service:8084"
    methods: ["GET", "POST", "PUT", "DELETE"]

  - path: "/health"
    prefix: false
    target: ""
    methods: ["GET"]
