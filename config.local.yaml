server:
  port: 1221
  host: "0.0.0.0"
  read_timeout: 15s
  write_timeout: 15s
  idle_timeout: 60s

cors:
  allowed_origins:
    - "*"
  allowed_methods:
    - "GET"
    - "POST"
    - "PUT"
    - "DELETE"
    - "PATCH"
    - "OPTIONS"
  allowed_headers:
    - "Content-Type"
    - "Authorization"
    - "X-Requested-With"
  expose_headers:
    - "Content-Length"
  allow_credentials: true
  max_age: 3600

routes:
  - path: "/api/auth"
    prefix: true
    target: "http://localhost:8080"
    methods: ["GET", "POST", "OPTIONS"]

  - path: "/api/users"
    prefix: true
    target: "http://localhost:8082"
    methods: ["GET", "POST", "PUT", "DELETE"]
    
  - path: "/api/products"
    prefix: true
    target: "http://localhost:8083"
    methods: ["GET", "POST", "PUT", "DELETE"]
    
  - path: "/api/orders"
    prefix: true
    target: "http://localhost:8084"
    methods: ["GET", "POST", "PUT", "DELETE"]

  - path: "/health"
    prefix: false
    target: ""
    methods: ["GET"]
